version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/database/queries"
    schema: "internal/database/migrations"
    gen:
      go:
        emit_json_tags: true
        package: "applicationdb"
        out: "internal/generated/applicationdb"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.bigint"
            go_type:
              type: "int64"
          - db_type: "pg_catalog.boolean"
            go_type:
              type: "bool"
          - db_type: "pg_catalog.text"
            go_type:
              type: "string"
          - db_type: "pg_catalog.bytea"
            go_type:
              type: "[]byte"
          - db_type: "pg_catalog.integer"
            go_type:
              type: "int64"
          - db_type: "pg_catalog.time"
            go_type:
              type: "Time"
              import: "time"
          - db_type: "pg_catalog.timestamp"
            go_type:
              type: "Time"
              import: "time"
